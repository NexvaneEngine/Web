<!--
	Starter template for new pages.

	The nav and footer are defined ONCE in scripts/components/nav-footer.js
	— every page just drops in <nexvane-nav></nexvane-nav> and
	<nexvane-footer></nexvane-footer> and gets the exact same header/footer,
	dark-mode toggle, and mobile hamburger menu behavior for free. To
	change the nav or footer site-wide, edit scripts/components/nav-footer.js
	only.

	scripts/ is split into:
	  - scripts/*.js            general, not tied to any one component
	                             (e.g. theme.js, lang.js)
	  - scripts/components/*.js generic, reusable pieces (nav, footer,
	                             sidebar, search, the language modal) —
	                             no page-specific content lives here
	  - scripts/manual/*.js     the User Manual page's OWN concrete data
	                             (its sidebar tree, its search manifests)
	                             — this is what "using" a generic
	                             component looks like; a different page
	                             with its own sidebar would get its own
	                             scripts/<page>/ folder the same way

	Every path in this project is RELATIVE (never starting with "/"), so
	the site works regardless of the domain/sub-path it's hosted under,
	or opened straight from disk. Because of that, the exact paths below
	depend on WHERE you save this file:

	Requirements for any new page:
	  1. Set window.SITE_BASE (see below) to the relative path back to
	     the project root: '' at the root, '../' one folder down (e.g.
	     about/team.html), '../../' two folders down, and so on. Nav,
	     sidebar and search scripts all read this to build correct
	     links/asset paths — this is the ONE thing you must get right
	     when relocating this file. Also set window.PAGE_LANG_JSON to
	     this file's own sidecar name (e.g. 'about/team.json') — this
	     can't be derived from the URL reliably (a server serving
	     index.html for a bare directory request leaves nothing in the
	     URL to detect), so it has to be stated explicitly too.
	  2. Link styles/base.css (shared layout/nav/footer/card styles) and
	     load the scripts below, ALL prefixed with the same relative
	     depth as SITE_BASE — e.g. one level down, all of them would
	     start with "../".
	  3. Include these scripts at the end of <body>, in this order:
	     components/nav-footer.js -> theme.js -> lang.js ->
	     components/lang-modal.js -> components/nav.js. (nav-footer.js
	     must load first so the nav/footer markup exists before the
	     other scripts look for it.)
	  4. Put <nexvane-nav></nexvane-nav> where the header should go, and
	     <nexvane-footer></nexvane-footer> where the footer should go.
	  5. For any text this page should show in more than one language,
	     give the element a lang="some-key" attribute (see the <h1>
	     below) and add "some-key" to this page's own JSON sidecar
	     (page.html -> page.json — see index.json or manual.json), once
	     under lang.en and once under lang.es. If the element ALSO
	     contains something that isn't translatable (an icon, another
	     element), wrap ONLY the text portion in its own <span
	     lang="...">, not the whole element — lang.js replaces an
	     element's entire innerHTML, so putting lang="..." on a parent
	     that also has a sibling icon would wipe the icon out. To
	     translate an ATTRIBUTE (placeholder, aria-label, ...) instead
	     of the element's content, add data-lang-attr="attributeName"
	     (space-separated for more than one) alongside lang="...".
	     Shared component text (nav, footer, sidebar chrome) already has
	     its own JSON — see scripts/components/nav-footer.lang.json —
	     you only need to add keys for THIS page's own content.

	Copy this file, rename it, and replace the <main> content below.
-->
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<!-- Adjust these two to match this file's actual name/depth — see above. -->
		<script>window.SITE_BASE = '';</script>
		<script>window.PAGE_LANG_JSON = 'page-template.json';</script>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

		<link rel="stylesheet" href="styles/base.css"/>
		<!-- Add a page-specific stylesheet here if this page needs one,
		     the same way index.html links styles/index.css. -->
	</head>

	<body>
		<nexvane-nav></nexvane-nav>

		<main>
			<div class="padded">
				<h1 lang="page-title">Page title</h1>
				<p>Page content goes here.</p>
			</div>
		</main>

		<nexvane-footer></nexvane-footer>

	</body>

	<script src="scripts/components/nav-footer.js"></script>
	<script src="scripts/theme.js"></script>
	<script src="scripts/lang.js"></script>
	<script src="scripts/components/lang-modal.js"></script>
	<script src="scripts/components/nav.js"></script>
</html>
