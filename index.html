<html>

		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<!-- How many directories deep this file lives, as a relative
		     prefix — '' at the project root, '../' one level down (e.g.
		     about/engine.html), '../../' two levels down, etc. Every
		     script that builds a link/asset path (nav, sidebar, search)
		     reads this instead of assuming the site is hosted at a
		     domain's root, so the same scripts work unmodified whether
		     this is served from a root domain, a sub-path, or opened
		     straight from disk. -->
		<script>window.SITE_BASE = '';</script>
		<!-- This page's own lang JSON sidecar (see scripts/lang.js for
		     why this can't just be derived from the URL). -->
		<script>window.PAGE_LANG_JSON = 'index.json';</script>
		<link rel="preconnect" href="https://fonts.googleapis.com">
